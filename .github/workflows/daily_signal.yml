name: 每日涨停板推荐

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00, 周一至周五
    - cron: '0 2 * * 1,2,3,4,5'
    # 北京时间 13:30 = UTC 05:30, 周一至周五
    - cron: '30 5 * * 1,2,3,4,5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python daily_scan.py
